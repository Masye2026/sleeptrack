
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to SleepTrack</title>
  <link rel="stylesheet" href="/theme.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 20px; font-family: system-ui, sans-serif; color: #30294e;
      background: radial-gradient(ellipse at top left,#e8deff,transparent 55%),#f8f6ff;
    }
    .card {
      width: min(100%,430px); padding: 32px; border-radius: 26px;
      background: #ffffffd9; border: 1px solid white;
      box-shadow: 0 20px 65px #51418418;
    }
    .moon { font-size: 55px; text-align: center; }
    h1,p { text-align: center; }
    h1 { margin-bottom: 8px; }
    .muted { color: #8982a4; font-size: 14px; line-height: 1.6; }
    label { display: block; margin: 16px 0 7px; font-size: 13px; font-weight: 700; }
    input { width: 100%; padding: 13px; border: 1px solid #e5def4; border-radius: 12px; font: inherit; }
    button { width: 100%; border: 0; border-radius: 12px; padding: 13px; margin-top: 16px; font: inherit; font-weight: 700; cursor: pointer; }
    .primary { color: white; background: #8270df; }
    .secondary { color: #6d5bc8; background: #eee9ff; }
    #message { white-space: pre-wrap; font-size: 13px; }
    #verifyBox { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="moon">🌙</div>
    <h1 id="heading">Welcome back, dreamer</h1>
    <p class="muted" id="subtitle">Your softer landing starts here.</p>

    <form id="authForm">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email"
             placeholder="you@example.com" required>

      <div id="passwordBox">
        <label for="password">Password</label>
        <input id="password" type="password"
               autocomplete="current-password" minlength="8" required>
      </div>

      <button class="primary" id="submitBtn" type="submit">Log in</button>
    </form>

    <div id="verifyBox">
      <label for="code">Email verification code</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code"
             placeholder="Enter the code from your email">
      <button class="primary" id="verifyBtn" type="button">Verify email</button>
    </div>

    <button class="secondary" id="switchBtn" type="button">
      New here? Create an account
    </button>
    <p id="message" class="muted" role="status"></p>
  </main>

  <script>
    /*
      Connect this page to your chosen authentication provider.
      The visual page is ready, but authentication needs a real
      provider and its project configuration before it can work.
    */
    const form = document.querySelector("#authForm");
    const passwordBox = document.querySelector("#passwordBox");
    const heading = document.querySelector("#heading");
    const subtitle = document.querySelector("#subtitle");
    const submitBtn = document.querySelector("#submitBtn");
    const switchBtn = document.querySelector("#switchBtn");
    const message = document.querySelector("#message");

    let mode = "login";

    switchBtn.addEventListener("click", () => {
      mode = mode === "login" ? "signup" : "login";
      heading.textContent = mode === "login"
        ? "Welcome back, dreamer" : "Create your sleep space";
      subtitle.textContent = mode === "login"
        ? "Your softer landing starts here."
        : "A little account for your journey.";
      submitBtn.textContent = mode === "login"
        ? "Log in" : "Create account";
      switchBtn.textContent = mode === "login"
        ? "New here? Create an account"
        : "Already have an account? Log in";
      passwordBox.querySelector("input").autocomplete =
        mode === "login" ? "current-password" : "new-password";
      message.textContent = "";
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      message.textContent =
        "Authentication isn't connected yet. Connect a real authentication provider to enable secure accounts.";
    });
  </script>
</body>
</html>
